[package]
name = "flux-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "flux_daemon"
path = "src/lib.rs"

[[bin]]
name = "fluxd"
path = "src/main.rs"

[dependencies]
flux-core = { path = "../flux-core" }
flux-disk = { path = "../flux-disk" }
flux-net = { path = "../flux-net" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal", "net", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
flux-api = { path = "../flux-api" }
async-trait = "0.1"
fastrand = "2"

[dev-dependencies]
sha1 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[lints]
workspace = true
