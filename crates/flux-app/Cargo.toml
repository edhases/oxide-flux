[package]
name = "flux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "flux_app"
path = "src/lib.rs"

[[bin]]
name = "oxide-flux"
path = "src/main.rs"

[dependencies]
flux-core = { path = "../flux-core" }
flux-daemon = { path = "../flux-daemon" }
flux-api = { path = "../flux-api" }
iced = { version = "0.14", features = ["tokio", "svg"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "1.3", features = ["archive-zip", "checksums"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sevenz-rust2 = "0.25"
fs2 = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"


[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"]

